<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Clock</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .clock {
            text-align: center;
            padding: 2rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #007bff;
            margin: 0 0 1rem 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>
</body>
 <!-- Step 1: Import React and ReactDOM as ESM and expose globally -->
  <script type="module">
    import React from 'https://esm.sh/react@19.2.0';
    import { createRoot } from 'https://esm.sh/react-dom@19.2.0/client';

    // Expose to global scope so Babel can access them
    window.React = React;
    window.createRoot = createRoot;
  </script>

  <!-- Step 2: Load Babel standalone -->
  <script src="https://unpkg.com/babel-standalone@6.15.0/babel.min.js"></script>

  <!-- Step 3: React code with JSX, compiled by Babel -->
  <script type="text/babel">
    function Clock() {
      return (
        <div className="clock">
          <h1>Hi AnuchitO</h1>
          <h2>Time: {new Date().toLocaleTimeString()}</h2>
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = createRoot(rootElement);

    function tick() {
      root.render(<Clock />);
    }

    tick();
    setInterval(tick, 1000);
  </script>
</html>
